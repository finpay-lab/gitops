apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: finpay-infra
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.15.6
          args:
            - "server"
            - "-dev"
            - "-dev-root-token-id=finpay-root-token"
            - "-dev-listen-address=0.0.0.0:8200"
          ports:
            - containerPort: 8200
          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "vault status -tls-skip-verify 2>/dev/null | grep -q 'Initialized.*true'"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: api
      port: 8200
      targetPort: 8200
---
# Run-once bootstrap: enable KV v2 + seed lab secrets.
# NOT in Argo sync loop (run-once). Re-run manually if Vault data is wiped.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault-bootstrap
    app.kubernetes.io/part-of: finpay-infra
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: hashicorp/vault:1.15.6
          env:
            - name: VAULT_ADDR
              value: "http://vault:8200"
            - name: VAULT_TOKEN
              value: "finpay-root-token"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              vault status -tls-skip-verify >/dev/null || { echo "vault not ready"; exit 1; }
              vault secrets enable -version=2 -path=secret kv || true
              vault policy write finpay-apps - <<'POL'
              path "secret/data/finpay/*" { capabilities = ["read","list"] }
              POL
              vault write secret/finpay/postgres username=finpay password=finpay
              vault write secret/finpay/kafka username=finpay password=finpay
              vault write secret/finpay/redis password=finpay
              vault write secret/finpay/minio rootUser=minioadmin rootPassword=minioadmin
              vault write secret/finpay/ghcr username=finpay password=CHANGEME
              vault write secret/finpay/ai key=CHANGEME
              echo "vault bootstrap complete"
