apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: finpay-infra
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-06-13T22-53-53Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "mc alias set local http://localhost:9000 minioadmin minioadmin && mc admin info local >/dev/null"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# Run-once: create the FinPay buckets. Not in Argo sync loop.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/part-of: finpay-infra
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: minio/mc:RELEASE.2024-06-13T22-53-53Z
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set local http://minio:9000 minioadmin minioadmin
              for b in finpay-kyc finpay-statements finpay-audit finpay-ai-artifacts; do
                mc mb --ignore-existing local/$b
                mc version enable local/$b
              done
              echo "minio buckets ready"
