apiVersion: apps/v1
kind: Deployment
metadata:
  name: finpay-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: finpay-web
    app.kubernetes.io/part-of: finpay
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: finpay-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finpay-web
        app.kubernetes.io/part-of: finpay
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: finpay-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: finpay-web
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: finpay-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
