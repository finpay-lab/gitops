apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finpay-services-default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  # Default deny all; explicit allow policies below open required paths.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finpay-services-allow-dns
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finpay-services-allow-gateway-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: finpay-services
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finpay-services-allow-infra
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: finpay-services
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: finpay-infra
      ports:
        - { protocol: TCP, port: 5432 }   # postgres
        - { protocol: TCP, port: 9092 }   # kafka
        - { protocol: TCP, port: 6379 }   # redis
        - { protocol: TCP, port: 9200 }   # opensearch
        - { protocol: TCP, port: 4317 }   # otel-collector
