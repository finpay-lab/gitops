apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finpay
  namespace: argocd
spec:
  description: FinPay Lab - all services and infra
  sourceRepos:
    - "*"
  destinations:
    - namespace: finpay-infra
      server: https://kubernetes.default.svc
    - namespace: finpay-services
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  syncWindows: []
