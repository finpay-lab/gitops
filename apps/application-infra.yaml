apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finpay-infra
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: finpay
spec:
  project: finpay
  source:
    repoURL: https://github.com/finpay-lab/gitops.git
    targetRevision: main
    path: charts/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: finpay-infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
